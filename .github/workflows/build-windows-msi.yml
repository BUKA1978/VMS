name: Build FVR VMS Etapa 10 Preview
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Verify .NET
        shell: pwsh
        run: dotnet --info
      - name: Publish Windows x64 EXE
        shell: pwsh
        run: dotnet publish .\preview\FVR.Monitoring.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\dist
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-Item .\dist\FVR.Monitoring.Client.exe
          Write-Host "EXE: $($exe.FullName)"
          Write-Host "SIZE: $($exe.Length) bytes"
          Get-FileHash $exe.FullName -Algorithm SHA256
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: FVR-VMS-Etapa10-Preview-win-x64
          path: dist/FVR.Monitoring.Client.exe
          if-no-files-found: error
          retention-days: 7
