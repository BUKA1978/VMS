name: Build FVR VMS 4.0.1 Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-current-vms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct validated VMS source archive
        shell: pwsh
        run: |
          $files = @(
            ".\source.part0.b64",
            ".\source.part1a.b64",
            ".\source.part1b.b64",
            ".\source.part2a.b64",
            ".\source.part2b.b64",
            ".\source.part3.b64",
            ".\source.part4.b64",
            ".\source.part5.b64",
            ".\source.part6.b64"
          )
          $base64 = (($files | ForEach-Object { Get-Content $_ -Raw }) -join "")
          [IO.File]::WriteAllBytes("FVR-VMS-current.tar.xz", [Convert]::FromBase64String($base64))
          $archive = Get-Item ".\FVR-VMS-current.tar.xz"
          $hash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Source archive bytes: $($archive.Length)"
          Write-Host "Source archive SHA-256: $hash"
          if ($hash -ne "a64f64cbf51cbdf90008c2a3656695625cdcfab0fdec167bd257e98384c25c81") {
            throw "Source archive checksum mismatch on Windows runner."
          }
          New-Item -ItemType Directory -Path ".\current-src" -Force | Out-Null
          tar -tf ".\FVR-VMS-current.tar.xz" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Source archive integrity check failed." }
          tar -xf ".\FVR-VMS-current.tar.xz" -C ".\current-src"
          if ($LASTEXITCODE -ne 0) { throw "Source archive extraction failed." }
          if (-not (Test-Path ".\current-src\FVR-VMS\installer\build-all.ps1")) {
            throw "FVR VMS source extraction failed."
          }

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply FVR VMS 4.0.1 corrections
        shell: pwsh
        run: |
          $root = Join-Path $PWD "current-src\FVR-VMS"
          $overrides = Join-Path $PWD "build\overrides"

          Copy-Item (Join-Path $overrides "FVR.ManagementServer.Program.cs") (Join-Path $root "FVR.ManagementServer\Program.cs") -Force
          Copy-Item (Join-Path $overrides "FVR.ManagementServer.appsettings.json") (Join-Path $root "FVR.ManagementServer\appsettings.json") -Force
          Copy-Item (Join-Path $overrides "FVR.MonitoringClient.App.xaml.cs") (Join-Path $root "FVR.MonitoringClient\App.xaml.cs") -Force
          Copy-Item (Join-Path $overrides "FVR.MonitoringClient.appsettings.json") (Join-Path $root "FVR.MonitoringClient\appsettings.json") -Force
          Copy-Item (Join-Path $overrides "FVR.RecordingServer.appsettings.json") (Join-Path $root "FVR.RecordingServer\appsettings.json") -Force
          Copy-Item (Join-Path $overrides "bootstrap-postgres.ps1") (Join-Path $root "database\bootstrap-postgres.ps1") -Force
          Copy-Item (Join-Path $overrides "FVR-VMS-4.0.1.iss") (Join-Path $root "installer\FVR-VMS.iss") -Force

          $mgmtProject = Join-Path $root "FVR.ManagementServer\FVR.ManagementServer.csproj"
          dotnet add $mgmtProject package Microsoft.Extensions.Hosting.WindowsServices --version 8.0.0
          if ($LASTEXITCODE -ne 0) { throw "Failed to add Windows Services package to Management Server." }

          $client = Join-Path $root "FVR.MonitoringClient"
          $clientProject = Join-Path $client "FVR.MonitoringClient.csproj"
          dotnet add $clientProject package Microsoft.Extensions.Configuration.Json --version 8.0.0
          if ($LASTEXITCODE -ne 0) { throw "Failed to add Configuration.Json package." }
          dotnet add $clientProject package Microsoft.Extensions.DependencyInjection --version 8.0.0
          if ($LASTEXITCODE -ne 0) { throw "Failed to add DependencyInjection package." }

          function Replace-InFile([string]$path, [string]$old, [string]$new) {
            $text = Get-Content $path -Raw
            if (-not $text.Contains($old)) { throw "Patch point not found in $path : $old" }
            Set-Content $path ($text.Replace($old, $new)) -Encoding utf8
          }

          Replace-InFile (Join-Path $client "Views\LoginWindow.xaml.cs") 'private async void PasswordBox_KeyDown(object sender, KeyEventArgs e)' 'private async void PasswordBox_KeyDown(object sender, System.Windows.Input.KeyEventArgs e)'
          Replace-InFile (Join-Path $client "Views\WallWindow.xaml.cs") 'private void Window_KeyDown(object sender, KeyEventArgs e)' 'private void Window_KeyDown(object sender, System.Windows.Input.KeyEventArgs e)'

          $main = Join-Path $client "Views\MainWindow.xaml.cs"
          $mainText = Get-Content $main -Raw
          $mainText = $mainText.Replace('private Point _dragStartPoint;', 'private System.Windows.Point _dragStartPoint;')
          $mainText = $mainText.Replace('private void CameraListBox_MouseMove(object sender, MouseEventArgs e)', 'private void CameraListBox_MouseMove(object sender, System.Windows.Input.MouseEventArgs e)')
          $mainText = $mainText.Replace('private void CameraTile_Drop(object sender, DragEventArgs e)', 'private void CameraTile_Drop(object sender, System.Windows.DragEventArgs e)')
          $mainText = $mainText.Replace('DragDrop.DoDragDrop(CameraListBox, camera, DragDropEffects.Copy);', 'System.Windows.DragDrop.DoDragDrop(CameraListBox, camera, System.Windows.DragDropEffects.Copy);')
          Set-Content $main $mainText -Encoding utf8

          foreach ($relative in @('Services\ApiClient.cs', 'Services\PtzService.cs')) {
            $path = Join-Path $client $relative
            $text = Get-Content $path -Raw
            if (-not $text.Contains('using System.Net.Http;')) {
              Set-Content $path ("using System.Net.Http;`r`n" + $text) -Encoding utf8
            }
          }

          $loginXaml = Join-Path $client "Views\LoginWindow.xaml"
          $loginText = Get-Content $loginXaml -Raw
          $loginText = $loginText.Replace('VMS 4.0 — Monitoring Client', 'VMS 4.0.1 — Monitoring Client')
          Set-Content $loginXaml $loginText -Encoding utf8

      - name: Publish Management, Recording and Monitoring Client
        id: publish
        working-directory: current-src/FVR-VMS
        shell: pwsh
        run: |
          .\installer\build-all.ps1 *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\publish.log"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }

      - name: Upload publish diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FVR-VMS-4.0.1-publish-log
          path: publish.log
          if-no-files-found: warn
          retention-days: 7

      - name: Download verified PostgreSQL 18.4 portable binaries
        shell: pwsh
        run: |
          $root = Join-Path $PWD "current-src\FVR-VMS"
          $zip = Join-Path $env:RUNNER_TEMP "postgresql-18.4-2-windows-x64-binaries.zip"
          $extract = Join-Path $env:RUNNER_TEMP "postgresql-18.4"
          $url = "https://get.enterprisedb.com/postgresql/postgresql-18.4-2-windows-x64-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "PostgreSQL SHA-256: $hash"
          if ($hash -ne "02e239529ed7833d169f98d915d3feffe0813264b08b3ae353e78e8b9c97e1a6") {
            throw "PostgreSQL binary checksum mismatch."
          }
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive $zip -DestinationPath $extract -Force
          $pgsql = Join-Path $extract "pgsql"
          if (-not (Test-Path (Join-Path $pgsql "bin\postgres.exe"))) { throw "PostgreSQL binaries not found after extraction." }
          $dest = Join-Path $root "publish\PostgreSQL"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item (Join-Path $pgsql "*") $dest -Recurse -Force

      - name: Smoke test database bootstrap and admin login
        shell: pwsh
        run: |
          $root = Join-Path $PWD "current-src\FVR-VMS"
          $publish = Join-Path $root "publish"
          $data = Join-Path $env:RUNNER_TEMP "fvr-vms-pgdata"
          if (Test-Path $data) { Remove-Item $data -Recurse -Force }

          & (Join-Path $publish "database\bootstrap-postgres.ps1") -AppRoot $publish -DataDir $data -NoService
          if ($LASTEXITCODE -ne 0) { throw "PostgreSQL/bootstrap smoke test failed." }

          $mgmtDir = Join-Path $publish "ManagementServer"
          $mgmtExe = Join-Path $mgmtDir "FVR.ManagementServer.exe"
          $proc = Start-Process -FilePath $mgmtExe -WorkingDirectory $mgmtDir -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $body = @{ username = 'admin'; password = 'FVR@2026!' } | ConvertTo-Json
                $login = Invoke-RestMethod -Uri 'http://127.0.0.1:5000/api/auth/login' -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 3
                if ($login.accessToken) {
                  $ready = $true
                  Write-Host "Admin login smoke test succeeded for user admin."
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw "Management Server did not accept admin / FVR@2026! within 60 seconds." }
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            & (Join-Path $publish "PostgreSQL\bin\pg_ctl.exe") stop -D $data -m fast -w | Out-Null
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer EXE
        shell: pwsh
        run: |
          $root = Join-Path $PWD "current-src\FVR-VMS"
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup installation." }
          & $iscc (Join-Path $root "installer\FVR-VMS.iss")
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }

      - name: Verify generated installer
        shell: pwsh
        run: |
          $setup = ".\current-src\FVR-VMS\publish\installer-output\FVR-VMS-4.0.1-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Installer EXE was not generated." }
          Get-Item $setup | Select-Object FullName, Length | Format-List
          Get-FileHash $setup -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FVR-VMS-4.0.1-Setup
          path: current-src/FVR-VMS/publish/installer-output/FVR-VMS-4.0.1-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload published applications
        uses: actions/upload-artifact@v4
        with:
          name: FVR-VMS-4.0.1-Windows-x64
          path: |
            current-src/FVR-VMS/publish/ManagementServer/**
            current-src/FVR-VMS/publish/RecordingServer/**
            current-src/FVR-VMS/publish/MonitoringClient/**
            current-src/FVR-VMS/publish/database/**
          if-no-files-found: error
          retention-days: 7
