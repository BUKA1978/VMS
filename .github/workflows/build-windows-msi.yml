name: Build FVR VMS Windows + MSI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source archive
        shell: pwsh
        run: |
          if (-not (Test-Path ".\project.tar.xz")) { throw "project.tar.xz not found." }
          tar -xf project.tar.xz
          if (-not (Test-Path ".\FVR-VMS-Etapa10-WindowsNative\FVR.VMS.Etapa10.sln")) {
            throw "Source archive extraction failed."
          }

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: FVR-VMS-Etapa10-WindowsNative/global.json

      - name: Verify SDK
        shell: pwsh
        run: |
          dotnet --info
          dotnet --version

      - name: Restore
        working-directory: FVR-VMS-Etapa10-WindowsNative
        shell: pwsh
        run: dotnet restore .\FVR.VMS.Etapa10.sln

      - name: Build solution
        working-directory: FVR-VMS-Etapa10-WindowsNative
        shell: pwsh
        run: dotnet build .\FVR.VMS.Etapa10.sln -c Release --no-restore

      - name: Publish Windows applications
        working-directory: FVR-VMS-Etapa10-WindowsNative
        shell: pwsh
        run: .\scripts\Build-Windows.ps1

      - name: Install WiX CLI
        shell: pwsh
        run: |
          dotnet tool install --global wix
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI
        working-directory: FVR-VMS-Etapa10-WindowsNative
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          .\scripts\Build-Installer.ps1

      - name: List generated binaries
        working-directory: FVR-VMS-Etapa10-WindowsNative
        shell: pwsh
        run: |
          Get-ChildItem .\release -Recurse -Filter *.exe | Select-Object FullName,Length | Format-Table -AutoSize
          Get-ChildItem .\installer\output -Filter *.msi | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: FVR-VMS-Etapa10-Windows-x64
          path: FVR-VMS-Etapa10-WindowsNative/release/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: FVR-VMS-Etapa10-MSI-x64
          path: FVR-VMS-Etapa10-WindowsNative/installer/output/*.msi
          if-no-files-found: error
          retention-days: 7
