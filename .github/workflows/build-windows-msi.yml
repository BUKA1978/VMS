name: Build Current FVR VMS Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-current-vms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct validated VMS source archive
        shell: pwsh
        run: |
          $files = @(
            ".\source.part0.b64",
            ".\source.part1a.b64",
            ".\source.part1b.b64",
            ".\source.part2a.b64",
            ".\source.part2b.b64",
            ".\source.part3.b64",
            ".\source.part4.b64",
            ".\source.part5.b64",
            ".\source.part6.b64"
          )
          $base64 = (($files | ForEach-Object { Get-Content $_ -Raw }) -join "")
          [IO.File]::WriteAllBytes("FVR-VMS-current.tar.xz", [Convert]::FromBase64String($base64))
          $archive = Get-Item ".\FVR-VMS-current.tar.xz"
          $hash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Source archive bytes: $($archive.Length)"
          Write-Host "Source archive SHA-256: $hash"
          if ($hash -ne "a64f64cbf51cbdf90008c2a3656695625cdcfab0fdec167bd257e98384c25c81") {
            throw "Source archive checksum mismatch on Windows runner."
          }
          New-Item -ItemType Directory -Path ".\current-src" -Force | Out-Null
          tar -tf ".\FVR-VMS-current.tar.xz" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Source archive integrity check failed." }
          tar -xf ".\FVR-VMS-current.tar.xz" -C ".\current-src"
          if ($LASTEXITCODE -ne 0) { throw "Source archive extraction failed." }
          if (-not (Test-Path ".\current-src\FVR-VMS\installer\build-all.ps1")) {
            throw "FVR VMS source extraction failed."
          }

      - name: Inspect authentication and database bootstrap sources
        shell: pwsh
        run: |
          $root = Join-Path $PWD "current-src\FVR-VMS"
          foreach ($rel in @(
            'FVR.ManagementServer\Controllers\AuthController.cs',
            'FVR.ManagementServer\Models\Entities.cs',
            'FVR.ManagementServer\Data\AppDbContext.cs',
            'FVR.ManagementServer\Program.cs',
            'FVR.ManagementServer\appsettings.json',
            'database\001_init_schema.sql',
            'installer\FVR-VMS.iss'
          )) {
            Write-Host "===== $rel ====="
            Get-Content (Join-Path $root $rel) -Raw
          }

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          dotnet --info
          dotnet --version

      - name: Make Management Server Windows-service compatible
        shell: pwsh
        run: |
          $root = Join-Path $PWD "current-src\FVR-VMS"
          $project = Join-Path $root "FVR.ManagementServer\FVR.ManagementServer.csproj"
          dotnet add $project package Microsoft.Extensions.Hosting.WindowsServices --version 8.0.0
          if ($LASTEXITCODE -ne 0) { throw "Failed to add Windows Services hosting package." }

          $programPath = Join-Path $root "FVR.ManagementServer\Program.cs"
          $program = Get-Content $programPath -Raw
          $needle = 'var builder = WebApplication.CreateBuilder(args);'
          if (-not $program.Contains($needle)) { throw "Management Server Program.cs patch point not found." }
          $replacement = "var builder = WebApplication.CreateBuilder(args);`r`nbuilder.Services.AddWindowsService(options => options.ServiceName = `"FVR Management Server`" );"
          $program = $program.Replace($needle, $replacement)
          Set-Content $programPath $program -Encoding utf8

      - name: Fix Monitoring Client compile issues
        shell: pwsh
        run: |
          $root = Join-Path $PWD "current-src\FVR-VMS"
          $client = Join-Path $root "FVR.MonitoringClient"
          $project = Join-Path $client "FVR.MonitoringClient.csproj"

          dotnet add $project package Microsoft.Extensions.Configuration.Json --version 8.0.0
          if ($LASTEXITCODE -ne 0) { throw "Failed to add Configuration.Json package." }
          dotnet add $project package Microsoft.Extensions.DependencyInjection --version 8.0.0
          if ($LASTEXITCODE -ne 0) { throw "Failed to add DependencyInjection package." }

          function Replace-InFile([string]$path, [string]$old, [string]$new) {
            $text = Get-Content $path -Raw
            if (-not $text.Contains($old)) { throw "Patch point not found in $path : $old" }
            $text = $text.Replace($old, $new)
            Set-Content $path $text -Encoding utf8
          }

          $app = Join-Path $client "App.xaml.cs"
          $appText = Get-Content $app -Raw
          if (-not $appText.Contains('using System.Net.Http;')) {
            $appText = $appText.Replace('using System.Windows;', "using System.Windows;`r`nusing System.Net.Http;")
          }
          $appText = $appText.Replace('public partial class App : Application', 'public partial class App : System.Windows.Application')
          $appText = $appText.Replace('protected override void OnStartup(StartupEventArgs e)', 'protected override void OnStartup(System.Windows.StartupEventArgs e)')
          Set-Content $app $appText -Encoding utf8

          Replace-InFile (Join-Path $client "Views\LoginWindow.xaml.cs") 'private async void PasswordBox_KeyDown(object sender, KeyEventArgs e)' 'private async void PasswordBox_KeyDown(object sender, System.Windows.Input.KeyEventArgs e)'

          $main = Join-Path $client "Views\MainWindow.xaml.cs"
          $mainText = Get-Content $main -Raw
          $mainText = $mainText.Replace('private Point _dragStartPoint;', 'private System.Windows.Point _dragStartPoint;')
          $mainText = $mainText.Replace('private void CameraListBox_MouseMove(object sender, MouseEventArgs e)', 'private void CameraListBox_MouseMove(object sender, System.Windows.Input.MouseEventArgs e)')
          $mainText = $mainText.Replace('private void CameraTile_Drop(object sender, DragEventArgs e)', 'private void CameraTile_Drop(object sender, System.Windows.DragEventArgs e)')
          $mainText = $mainText.Replace('DragDrop.DoDragDrop(CameraListBox, camera, DragDropEffects.Copy);', 'System.Windows.DragDrop.DoDragDrop(CameraListBox, camera, System.Windows.DragDropEffects.Copy);')
          Set-Content $main $mainText -Encoding utf8

          Replace-InFile (Join-Path $client "Views\WallWindow.xaml.cs") 'private void Window_KeyDown(object sender, KeyEventArgs e)' 'private void Window_KeyDown(object sender, System.Windows.Input.KeyEventArgs e)'

          foreach ($relative in @('Services\ApiClient.cs', 'Services\PtzService.cs')) {
            $path = Join-Path $client $relative
            $text = Get-Content $path -Raw
            if (-not $text.Contains('using System.Net.Http;')) {
              $text = "using System.Net.Http;`r`n" + $text
              Set-Content $path $text -Encoding utf8
            }
          }

      - name: Fix installer metadata
        shell: pwsh
        run: |
          $issPath = Join-Path $PWD "current-src\FVR-VMS\installer\FVR-VMS.iss"
          $iss = Get-Content $issPath -Raw
          $iss = $iss.Replace('AppId={{B4C1F6A0-9F2E-4B7A-9C1D-FVRVMS40000}}', 'AppId={{B4C1F6A0-9F2E-4B7A-9C1D-F40000040000}}')
          $iss = $iss.Replace('#define MyAppPublisher "Sua Empresa"', '#define MyAppPublisher "FVR"')
          Set-Content $issPath $iss -Encoding utf8

      - name: Publish Management, Recording and Monitoring Client
        id: publish
        continue-on-error: true
        working-directory: current-src/FVR-VMS
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "publish.log"
          $failed = $false
          try {
            .\installer\build-all.ps1 *>&1 | Tee-Object -FilePath $log
          }
          catch {
            $failed = $true
            $_ | Out-String | Tee-Object -FilePath $log -Append | Write-Host
          }
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }

      - name: Upload publish diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FVR-VMS-publish-log
          path: publish.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop after publish failure
        if: steps.publish.outcome == 'failure'
        shell: pwsh
        run: throw "dotnet publish failed; diagnostic artifact uploaded."

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer EXE
        shell: pwsh
        run: |
          $root = Join-Path $PWD "current-src\FVR-VMS"
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup installation." }
          & $iscc (Join-Path $root "installer\FVR-VMS.iss")
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }

      - name: Verify generated installer
        shell: pwsh
        run: |
          $setup = ".\current-src\FVR-VMS\publish\installer-output\FVR-VMS-4.0.0-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Installer EXE was not generated." }
          Get-Item $setup | Select-Object FullName, Length | Format-List
          Get-FileHash $setup -Algorithm SHA256 | Format-List
          Get-ChildItem ".\current-src\FVR-VMS\publish" -Recurse -Filter *.exe | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FVR-VMS-4.0.0-Setup
          path: current-src/FVR-VMS/publish/installer-output/FVR-VMS-4.0.0-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload published applications
        uses: actions/upload-artifact@v4
        with:
          name: FVR-VMS-4.0.0-Windows-x64
          path: |
            current-src/FVR-VMS/publish/ManagementServer/**
            current-src/FVR-VMS/publish/RecordingServer/**
            current-src/FVR-VMS/publish/MonitoringClient/**
          if-no-files-found: error
          retention-days: 7
