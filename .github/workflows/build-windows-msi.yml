name: Build FVR VMS Etapa 10 Full Windows + MSI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify full source
        shell: pwsh
        run: |
          $parts = 0..15 | ForEach-Object {
            $p = ".\ci\final\part{0:D2}.b64" -f $_
            if (-not (Test-Path $p)) { throw "Missing source part: $p" }
            Get-Content $p -Raw
          }
          $base64 = ($parts -join "")
          [IO.File]::WriteAllBytes("project.tar.xz", [Convert]::FromBase64String($base64))
          $hash = (Get-FileHash .\project.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Full source SHA256: $hash"
          if ($hash -ne "a321a55f87979ee84f16d1e5db87a6633e5e536418ac443e755e88888e218dd4") {
            throw "Source archive SHA256 mismatch: $hash"
          }
          tar -xf project.tar.xz
          if (-not (Test-Path ".\FVR-VMS-Etapa10-WindowsNative\FVR.VMS.Etapa10.sln")) {
            throw "Full source reconstruction failed."
          }

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: FVR-VMS-Etapa10-WindowsNative/global.json

      - name: Verify SDK
        shell: pwsh
        run: |
          dotnet --info
          dotnet --version

      - name: Restore
        working-directory: FVR-VMS-Etapa10-WindowsNative
        shell: pwsh
        run: dotnet restore .\FVR.VMS.Etapa10.sln

      - name: Build solution
        working-directory: FVR-VMS-Etapa10-WindowsNative
        shell: pwsh
        run: dotnet build .\FVR.VMS.Etapa10.sln -c Release --no-restore

      - name: Prepare FFmpeg for Recording Server
        shell: pwsh
        run: |
          $ff = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if (-not $ff) {
            choco install ffmpeg -y --no-progress
            $env:PATH = [Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [Environment]::GetEnvironmentVariable("PATH", "User")
            $ff = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          }
          if (-not $ff) { throw "ffmpeg.exe not available on runner." }
          $dest = ".\FVR-VMS-Etapa10-WindowsNative\src\FVR.Recording.Service\tools"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $ff.Source (Join-Path $dest "ffmpeg.exe") -Force
          Get-Item (Join-Path $dest "ffmpeg.exe") | Select-Object FullName, Length

      - name: Publish Windows applications
        working-directory: FVR-VMS-Etapa10-WindowsNative
        shell: pwsh
        run: .\scripts\Build-Windows.ps1

      - name: Install WiX CLI
        shell: pwsh
        run: |
          if (-not (Get-Command wix -ErrorAction SilentlyContinue)) {
            dotnet tool install --global wix
          }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix --version

      - name: Build MSI
        working-directory: FVR-VMS-Etapa10-WindowsNative
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          .\scripts\Build-Installer.ps1

      - name: Verify required binaries
        working-directory: FVR-VMS-Etapa10-WindowsNative
        shell: pwsh
        run: |
          $required = @(
            ".\release\Management-Service\FVR.Management.Service.exe",
            ".\release\Recording-Service\FVR.Recording.Service.exe",
            ".\release\Management-Console\FVR.Management.Console.exe",
            ".\release\Monitoring-Client\FVR.Monitoring.Client.exe",
            ".\release\Setup-Wizard\FVR.Setup.Wizard.exe",
            ".\release\Product-Updater\FVR.Product.Updater.exe",
            ".\release\Support-Tool\FVR.Support.Tool.exe",
            ".\release\Load-Test\FVR.LoadTest.exe",
            ".\release\Video-Benchmark\FVR.Video.Benchmark.exe",
            ".\release\Tools\ffmpeg.exe"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing required binary: $f" }
          }
          $msi = Get-ChildItem .\installer\output -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI not generated." }
          Get-ChildItem .\release -Recurse -Filter *.exe | Select-Object FullName, Length | Format-Table -AutoSize
          $msi | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: FVR-VMS-Etapa10-Full-Windows-x64
          path: FVR-VMS-Etapa10-WindowsNative/release/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: FVR-VMS-Etapa10-Full-MSI-x64
          path: FVR-VMS-Etapa10-WindowsNative/installer/output/*.msi
          if-no-files-found: error
          retention-days: 7
